name: imaging
channels:
  - pytorch
  - nvidia
  - conda-forge
dependencies:
  - python=3.9
  - pip
  - ipykernel
  - pytorch
  - torchvision
  - matplotlib
  - pandas
  - scikit-image
  - scikit-learn
  - seaborn
  - numba
  - dask
  - dask-jobqueue
  - openpyxl
  - bioformats_jar
  - ipyfilechooser
  - pip:
      - statannotations
      - imaris-ims-file-reader
      - nd2
      - bm3d
      - cellpose
      - readlif
      - fsspec
      - aicspylibczi
      - aicsimageio[all]
      - tensorflow

